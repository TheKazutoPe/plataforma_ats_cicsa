<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ingreso Técnico - Plataforma ATS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --cicsa: #003366;
      --cicsa-soft: #e6eef7;
      --accent: #ff6600;
      --bg: #0f172a;
      --radius-card: 24px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('https://images.unsplash.com/photo-1580920461931-ccb0bb8415e5?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #1f1f1f;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(0, 51, 102, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
      backdrop-filter: blur(8px);
      z-index: 0;
    }

    .login-wrapper {
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      max-width: 400px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius-card);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.25);
      padding: 36px 32px 28px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    @media (max-width: 575px) {
      .login-wrapper {
        padding: 15px;
      }
      .login-card {
        padding: 30px 20px 24px;
        border-radius: 20px;
      }
    }

    @media (min-width: 576px) {
      .login-card {
        padding: 40px 36px 32px;
      }
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: -50px;
      right: -50px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255,102,0,0.1), rgba(255,102,0,0.05));
    }

    .login-header {
      text-align: center;
      margin-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .login-logo {
      height: 50px;
      margin-bottom: 4px;
      object-fit: contain;
    }

    .login-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--cicsa);
      text-transform: uppercase;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 11px;
      color: #6c757d;
    }

    .pill-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--cicsa-soft);
      color: var(--cicsa);
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .pill-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(255, 102, 0, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
    }

    label.form-label {
      font-size: 12px;
      font-weight: 600;
      color: #222;
      margin-bottom: 3px;
    }

    .form-control {
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      font-size: 14px;
      padding: 10px 14px;
      background: #f8fafc;
      transition: all 0.2s;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255, 102, 0, 0.1);
      outline: none;
    }

    .login-btn {
      width: 100%;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 0;
      margin-top: 12px;
      background: var(--accent);
      border: none;
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 102, 0, 0.25);
    }

    .login-btn:hover {
      background: #e65c00;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 102, 0, 0.35);
      color: white;
    }

    .hint-footer {
      font-size: 9px;
      color: #9a9fa8;
      text-align: center;
      margin-top: 8px;
    }

    .alert {
      font-size: 11px;
      padding: 6px 9px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="{{ url_for('static', filename='logo_cicsa.png') }}" alt="CICSA" class="login-logo">
      <div class="login-title">Ingreso Técnico</div>
      <div class="login-subtitle">Plataforma digital ATS · Charla de 5 minutos</div>
      <div class="pill-tag">
        <span class="pill-dot"></span>
        Acceso exclusivo personal autorizado
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger text-center" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" autocomplete="off">
      <div class="mb-2">
        <label class="form-label" for="usuario">Usuario</label>
        <input
          id="usuario"
          name="usuario"
          class="form-control"
          placeholder="Ingresa tu usuario"
          required
        >
      </div>
      <div class="mb-1">
        <label class="form-label" for="clave">Clave</label>
        <input
          id="clave"
          type="password"
          name="clave"
          class="form-control"
          placeholder="Ingresa tu clave"
          required
        >
      </div>
      <button class="btn login-btn" type="submit">
        Ingresar a la plataforma
      </button>
    </form>

    <div class="hint-footer">
      CICSA PERÚ S.A.C · Seguridad y Salud en el Trabajo
    </div>
  </div>
</div>
</body>
</html>
